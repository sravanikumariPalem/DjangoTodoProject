<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}To-Do App{% endblock %}</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light mb-4" style="background-color: #e3f2fd;">
        <div class="container">
            <a class="navbar-brand" href="/">To-Do App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">

                    {% if user.is_authenticated %}
                    
                    <!-- RAG MENU FOR LOGGED-IN USERS -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'rag_upload' %}">📄 Upload Docs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'rag_chat' %}">💬 RAG Chat</a>
                    </li>

                    <li class="nav-item">
                        <span class="nav-link">Hello, {{ user.username }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm" href="{% url 'register' %}">Register</a>
                    </li>
                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>

    <!-- TOAST CONTAINER -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
      {% for message in messages %}
        <div class="toast align-items-center text-white
                  {% if message.tags == 'success' %}bg-success
                  {% elif message.tags == 'warning' %}bg-warning
                  {% elif message.tags == 'error' %}bg-danger
                  {% else %}bg-primary{% endif %}
                  border-0 show mb-2" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                  {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
      {% endfor %}
    </div>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toastElList = [].slice.call(document.querySelectorAll('.toast'))
            toastElList.map(function (toastEl) {
                const toast = new bootstrap.Toast(toastEl, { delay: 2000 })
                toast.show()
            })
        })
    </script>
</body>
</html>
