<!-- rag_upload.html -->
{% extends 'tasks/base.html' %}
{% block content %}
<h2>Upload documents (pdf/docx/csv)</h2>
<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <input type="file" name="files" multiple>
  <button type="submit" class="btn btn-primary">Upload & Index</button>
</form>
{% endblock %}
